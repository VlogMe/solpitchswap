<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b12" />
    <meta name="description" content="Discover, vote for, and swap Solana projects through the SolPitch Network." />
    <link rel="icon" type="image/png" href="https://solpitchswap.kevingpersson.workers.dev/logo.png" />
    <link rel="apple-touch-icon" href="https://solpitchswap.kevingpersson.workers.dev/logo.png" />
    <title>SolPitch Network | Discover • Vote • Swap Solana Projects</title>
    <script type="module" crossorigin src="/solpitchswap/assets/index-COZRiZmD.js"></script>
    <link rel="stylesheet" crossorigin href="/solpitchswap/assets/index-B6bBU_si.css">
    <style>
      .project-detail .detail-columns { display: block !important; }
      .project-detail .detail-panel,
      .project-detail .claim-panel { width: 100% !important; min-width: 0 !important; }
      .project-detail .claim-panel { margin-top: 14px !important; }
      .project-detail .full-ca { align-items: center !important; }
      .project-detail .full-ca b { flex: 0 0 auto !important; white-space: nowrap !important; }
      .project-detail .claim-panel .claim-button { width: 100%!important; white-space: normal!important; line-height:1.3!important; }
      .live-activity-panel { display: none !important; }
      .listing-card .trust-note { display: none !important; }
      .trending-strip,
      .directory-summary,
      .feed-toolbar .filter-row { display: none !important; }
      .utility-rail > section:nth-of-type(3),
      .utility-rail > section:nth-of-type(4) { display: none !important; }
      .feed-toolbar { display: block !important; padding-top: 10px !important; padding-bottom: 22px !important; }
      .feed-toolbar > div:first-child { width: 100% !important; }
      .feed-toolbar .eyebrow { display: block !important; margin-bottom: 12px !important; font-size: 14px !important; line-height: 1.2 !important; font-weight: 800 !important; letter-spacing: 0.18em !important; text-transform: uppercase !important; }
      .feed-toolbar h2 { max-width: 920px !important; margin: 0 !important; font-size: clamp(36px, 3vw, 48px) !important; line-height: 1.08 !important; font-weight: 800 !important; letter-spacing: -0.025em !important; }
      .directory-submit-link { color: #b99cff; cursor: pointer; font: inherit; font-weight: 800; text-decoration: none; }
      .directory-submit-link:hover,
      .directory-submit-link:focus-visible { color: #ffffff; text-decoration: underline; outline: none; }
      .submission-claim-note { margin: 0 0 10px !important; }
      .solpitch-site-footer { width: 100%; margin: 22px 0 72px; padding: 20px 24px; border: 1px solid #232838; border-radius: 16px; background: linear-gradient(180deg, #111620, #0b0f17); color: #8d95aa; font-family: Inter, ui-sans-serif, system-ui, sans-serif; text-align: center; flex: 0 0 auto; }
      .solpitch-site-footer nav { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px 20px; margin-bottom: 10px; }
      .solpitch-site-footer a { color: #b99cff; font-weight: 800; text-decoration: none; }
      .solpitch-site-footer a:hover { color: #ffffff; text-decoration: underline; }
      .solpitch-site-footer p { margin: 0; font-size: 0.78rem; }
      @media (max-width: 700px) {
        .feed-toolbar h2 { font-size: 32px !important; }
        .solpitch-site-footer { margin-bottom: 24px; padding: 18px 16px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <template id="solpitch-footer-template">
      <footer class="solpitch-site-footer" aria-label="SolPitch legal footer">
        <nav aria-label="Legal and contact links">
          <a href="./privacy.html">Privacy Policy</a>
          <a href="./terms.html">Terms &amp; Conditions</a>
          <a href="https://x.com/solpitch2026" target="_blank" rel="noreferrer">Contact @solpitch2026 on X</a>
        </nav>
        <p>© 2026 solpitch.com All rights reserved.</p>
      </footer>
    </template>

    <script>
      (() => {
        const API_BASE = 'https://solpitchswap.kevingpersson.workers.dev';
        let publishedProjectsPromise = null;

        const openSubmissionForm = () => {
          const submitButton = Array.from(document.querySelectorAll('button')).find((button) => {
            const text = button.textContent?.trim().toLowerCase();
            return text === 'submit project' || text === 'submit coin';
          });
          submitButton?.click();
        };

        const getPublishedProjects = async () => {
          if (!publishedProjectsPromise) {
            publishedProjectsPromise = fetch(`${API_BASE}/api/projects`, { credentials: 'include' })
              .then((response) => {
                if (!response.ok) throw new Error(`Project lookup failed (${response.status})`);
                return response.json();
              })
              .then((body) => Array.isArray(body.projects) ? body.projects : [])
              .catch((error) => {
                publishedProjectsPromise = null;
                throw error;
              });
          }
          return publishedProjectsPromise;
        };

        const loadProjectSlugInSwap = async (slug) => {
          if (!slug) return;

          const projects = await getPublishedProjects();
          const project = projects.find((item) => String(item.slug || '') === slug);
          const contractAddress = String(project?.contract_address || '').trim();
          if (!contractAddress) return;

          const swapFrame = document.querySelector('.embedded-swap iframe');
          if (!swapFrame) return;

          swapFrame.src = `https://solpitch.net/widget?outputMint=${encodeURIComponent(contractAddress)}`;
          document.querySelector('.embedded-swap')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        const loadCardProjectInSwap = async (card) => {
          const slug = card.getAttribute('data-project-slug') || '';
          return loadProjectSlugInSwap(slug);
        };

        const wireDirectoryBuyButtons = () => {
          document.querySelectorAll('.listing-card').forEach((card) => {
            const actions = card.querySelector('.listing-actions');
            if (!actions) return;

            const staleSwapButton = Array.from(actions.querySelectorAll('button, a')).find((element) => {
              const text = element.textContent?.trim().toLowerCase() ?? '';
              return text === 'not on swap' || text === 'trade on solpitch' || text === 'buy' || text.startsWith('buy $');
            });
            if (!staleSwapButton) return;

            if (staleSwapButton.textContent?.trim() !== 'Buy') {
              staleSwapButton.textContent = 'Buy';
            }
            staleSwapButton.removeAttribute('disabled');
            staleSwapButton.removeAttribute('aria-disabled');
            staleSwapButton.classList.remove('disabled');

            if (staleSwapButton.dataset.buyWired === 'embedded-project-mint') return;
            staleSwapButton.dataset.buyWired = 'embedded-project-mint';

            staleSwapButton.addEventListener('click', (event) => {
              event.preventDefault();
              event.stopPropagation();
              void loadCardProjectInSwap(card).catch((error) => console.error('Unable to load project in embedded swap', error));
            });
          });
        };

        const wireProjectDetailBuyButton = () => {
          const detail = document.querySelector('.project-detail[data-project-slug]');
          if (!detail) return;

          const slug = detail.getAttribute('data-project-slug') || '';
          if (!slug) return;

          const actions = detail.querySelector('.detail-hero .detail-actions');
          if (!actions) return;

          let buyButton = Array.from(actions.querySelectorAll('button, a')).find((element) => {
            const text = element.textContent?.trim().toLowerCase() ?? '';
            return text === 'trade on solpitch' || text === 'buy' || text.startsWith('buy $');
          });

          if (!buyButton) {
            buyButton = document.createElement('button');
            buyButton.className = 'primary';
            actions.appendChild(buyButton);
          }

          const symbol = detail.querySelector('.detail-identity h1 span')?.textContent?.trim() || '';
          const desiredLabel = symbol ? `Buy ${symbol}` : 'Buy';
          if (buyButton.textContent?.trim() !== desiredLabel) {
            buyButton.textContent = desiredLabel;
          }

          buyButton.removeAttribute('href');
          buyButton.removeAttribute('target');
          buyButton.removeAttribute('disabled');
          buyButton.removeAttribute('aria-disabled');

          if (buyButton.dataset.buyWired === 'embedded-project-detail') return;
          buyButton.dataset.buyWired = 'embedded-project-detail';

          buyButton.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            void loadProjectSlugInSwap(slug).catch((error) => console.error('Unable to load project detail in embedded swap', error));
          });
        };

        const updatePublishedCopy = () => {
          const searchInput = document.querySelector('.contract-search input');
          if (searchInput && searchInput.placeholder !== 'Paste a contract address to find a project') {
            searchInput.placeholder = 'Paste a contract address to find a project';
          }

          const widget = document.querySelector('.leaderboard-widget');
          if (widget) {
            const heading = widget.querySelector('.widget-title h3');
            if (heading && heading.textContent !== 'Projects with the most votes') {
              heading.textContent = 'Projects with the most votes';
            }

            const note = widget.querySelector('.ranking-note');
            if (note && note.textContent !== 'Use your Phantom wallet to vote once per week') {
              note.textContent = 'Use your Phantom wallet to vote once per week';
            }
          }

          const directoryHeading = document.querySelector('.feed-toolbar h2');
          if (directoryHeading && directoryHeading.dataset.cleanDirectory !== 'true') {
            directoryHeading.innerHTML = 'Explore New Tokens or <span class="directory-submit-link" role="link" tabindex="0">Submit Your Solana Project</span>';
            directoryHeading.dataset.cleanDirectory = 'true';

            const submitLink = directoryHeading.querySelector('.directory-submit-link');
            submitLink?.addEventListener('click', openSubmissionForm);
            submitLink?.addEventListener('keydown', (event) => {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openSubmissionForm();
              }
            });
          }

          const submissionShell = Array.from(document.querySelectorAll('.workflow-shell')).find((shell) => {
            const title = shell.querySelector('h1');
            return title && (title.textContent === 'Suggest a Solana project' || title.textContent === 'Submit Solana Projects');
          });
          if (submissionShell) {
            const title = submissionShell.querySelector('h1');
            if (title && title.textContent !== 'Submit Solana Projects') {
              title.textContent = 'Submit Solana Projects';
            }

            const intro = submissionShell.querySelector('.workflow-intro');
            if (intro && !submissionShell.querySelector('.submission-claim-note')) {
              const claimNote = document.createElement('p');
              claimNote.className = 'submission-claim-note';
              claimNote.textContent = 'Once approved by admin you can claim it using your Phantom dev wallet if it is yours, or you can invite the owner to claim the listing.';
              intro.before(claimNote);
            }
          }

          wireDirectoryBuyButtons();
          wireProjectDetailBuyButton();
        };

        const mountFooter = () => {
          updatePublishedCopy();

          const target = document.querySelector('.project-detail, .project-feed');
          if (!target) return;

          let footer = target.querySelector(':scope > .solpitch-site-footer');

          if (!footer) {
            document.querySelectorAll('.solpitch-site-footer').forEach((item) => item.remove());

            const template = document.getElementById('solpitch-footer-template');
            if (!(template instanceof HTMLTemplateElement)) return;

            footer = template.content.firstElementChild.cloneNode(true);
            target.appendChild(footer);
            return;
          }

          if (footer !== target.lastElementChild) {
            target.appendChild(footer);
          }
        };

        const observer = new MutationObserver(mountFooter);
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });

        window.addEventListener('hashchange', () => requestAnimationFrame(mountFooter));
        requestAnimationFrame(mountFooter);
      })();
    </script>
  </body>
</html>
