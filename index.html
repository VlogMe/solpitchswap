<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b12" />
    <meta name="description" content="Discover, vote for, and swap Solana projects through the SolPitch Network." />
    <link rel="icon" type="image/png" href="https://solpitchswap.kevingpersson.workers.dev/logo.png" />
    <link rel="apple-touch-icon" href="https://solpitchswap.kevingpersson.workers.dev/logo.png" />
    <title>SolPitch Network | Discover • Vote • Swap Solana Projects</title>
    <script type="module" crossorigin src="/solpitchswap/assets/index-COZRiZmD.js"></script>
    <link rel="stylesheet" crossorigin href="/solpitchswap/assets/index-B6bBU_si.css">
    <style>
      .project-detail .detail-columns {
        display: block !important;
      }

      .project-detail .detail-panel,
      .project-detail .claim-panel {
        width: 100% !important;
        min-width: 0 !important;
      }

      .project-detail .claim-panel {
        margin-top: 14px !important;
      }

      .project-detail .full-ca {
        align-items: center !important;
      }

      .project-detail .full-ca b {
        flex: 0 0 auto !important;
        white-space: nowrap !important;
      }

      .project-detail .claim-panel .claim-button {
        width: 100% !important;
        white-space: normal !important;
        line-height: 1.3 !important;
      }

      .live-activity-panel {
        display: none !important;
      }

      .trending-strip,
      .directory-summary,
      .feed-toolbar .filter-row,
      .solpitch-obsolete-widget {
        display: none !important;
      }

      .feed-toolbar {
        display: block !important;
        padding-top: 10px !important;
        padding-bottom: 22px !important;
      }

      .feed-toolbar > div:first-child {
        width: 100% !important;
      }

      .feed-toolbar .eyebrow {
        display: block !important;
        margin-bottom: 12px !important;
        font-size: 14px !important;
        line-height: 1.2 !important;
        font-weight: 800 !important;
        letter-spacing: 0.18em !important;
        text-transform: uppercase !important;
      }

      .feed-toolbar h2 {
        max-width: 920px !important;
        margin: 0 !important;
        font-size: clamp(36px, 3vw, 48px) !important;
        line-height: 1.08 !important;
        font-weight: 800 !important;
        letter-spacing: -0.025em !important;
      }

      .directory-submit-link {
        color: #b99cff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        text-decoration: none;
      }

      .directory-submit-link:hover,
      .directory-submit-link:focus-visible {
        color: #ffffff;
        text-decoration: underline;
        outline: none;
      }

      .submission-claim-note {
        margin: 0 0 10px !important;
      }

      .solpitch-site-footer {
        width: 100%;
        margin: 22px 0 72px;
        padding: 20px 24px;
        border: 1px solid #232838;
        border-radius: 16px;
        background: linear-gradient(180deg, #111620, #0b0f17);
        color: #8d95aa;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        flex: 0 0 auto;
      }

      .solpitch-site-footer nav {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px 20px;
        margin-bottom: 10px;
      }

      .solpitch-site-footer a {
        color: #b99cff;
        font-weight: 800;
        text-decoration: none;
      }

      .solpitch-site-footer a:hover {
        color: #ffffff;
        text-decoration: underline;
      }

      .solpitch-site-footer p {
        margin: 0;
        font-size: 0.78rem;
      }

      @media (max-width: 700px) {
        .feed-toolbar h2 {
          font-size: 32px !important;
        }

        .solpitch-site-footer {
          margin-bottom: 24px;
          padding: 18px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <template id="solpitch-footer-template">
      <footer class="solpitch-site-footer" aria-label="SolPitch legal footer">
        <nav aria-label="Legal and contact links">
          <a href="./privacy.html">Privacy Policy</a>
          <a href="./terms.html">Terms &amp; Conditions</a>
          <a href="https://x.com/solpitch2026" target="_blank" rel="noreferrer">Contact @solpitch2026 on X</a>
        </nav>
        <p>© 2026 solpitch.com All rights reserved.</p>
      </footer>
    </template>

    <script>
      (() => {
        let leaderboardProjects = null;
        let leaderboardLoading = false;

        const openSubmissionForm = () => {
          const submitButton = Array.from(document.querySelectorAll('button')).find((button) => {
            const text = button.textContent?.trim().toLowerCase();
            return text === 'submit project' || text === 'submit coin';
          });
          submitButton?.click();
        };

        const renderTopLeaderboard = () => {
          const widget = document.querySelector('.leaderboard-widget');
          if (!widget || !Array.isArray(leaderboardProjects)) return;

          const projects = leaderboardProjects.slice(0, 15);
          const signature = projects.map((project) => `${project.id || project.slug}:${project.votes || 0}`).join('|');
          const rows = widget.querySelectorAll(':scope > .leaderboard-rank');
          if (widget.dataset.top15Signature === signature && rows.length === projects.length) return;

          rows.forEach((row) => row.remove());
          widget.querySelector(':scope > .side-empty')?.remove();

          const note = widget.querySelector('.ranking-note');
          projects.forEach((project, index) => {
            const button = document.createElement('button');
            button.className = 'rank leaderboard-rank';
            button.type = 'button';

            const rank = document.createElement('b');
            rank.textContent = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : String(index + 1);

            const avatar = document.createElement('div');
            avatar.className = 'mini-avatar';
            if (project.logo_url) {
              const img = document.createElement('img');
              img.src = project.logo_url;
              img.alt = `${project.name || project.symbol || 'Project'} logo`;
              avatar.appendChild(img);
            } else {
              avatar.textContent = String(project.symbol || '?').slice(0, 2);
            }

            const identity = document.createElement('span');
            const name = document.createElement('strong');
            name.textContent = project.name || 'Solana Project';
            const symbol = document.createElement('small');
            symbol.textContent = `$${project.symbol || ''}`;
            identity.append(name, symbol);

            const votes = document.createElement('em');
            votes.className = 'animated-count';
            votes.textContent = `▲ ${Number(project.votes || 0)}`;

            button.append(rank, avatar, identity, votes);
            button.addEventListener('click', () => {
              window.location.hash = `#/project/${encodeURIComponent(project.slug)}`;
            });

            widget.insertBefore(button, note);
          });

          widget.dataset.top15Signature = signature;
        };

        const loadTopLeaderboard = () => {
          if (leaderboardProjects) {
            renderTopLeaderboard();
            return;
          }
          if (leaderboardLoading) return;
          leaderboardLoading = true;
          fetch('https://solpitchswap.kevingpersson.workers.dev/api/projects')
            .then((response) => response.ok ? response.json() : Promise.reject(new Error('Leaderboard unavailable')))
            .then((body) => {
              leaderboardProjects = Array.isArray(body.projects)
                ? [...body.projects].sort((a, b) => Number(b.votes || 0) - Number(a.votes || 0)).slice(0, 15)
                : [];
              renderTopLeaderboard();
            })
            .catch(() => {})
            .finally(() => { leaderboardLoading = false; });
        };

        const updatePublishedCopy = () => {
          const searchInput = document.querySelector('.contract-search input');
          if (searchInput && searchInput.placeholder !== 'Paste a contract address to find a project') {
            searchInput.placeholder = 'Paste a contract address to find a project';
          }

          const widget = document.querySelector('.leaderboard-widget');
          if (widget) {
            const heading = widget.querySelector('.widget-title h3');
            if (heading && heading.textContent !== 'Projects with the most votes') {
              heading.textContent = 'Projects with the most votes';
            }

            const note = widget.querySelector('.ranking-note');
            if (note && note.textContent !== 'Use your Phantom wallet to vote once per week') {
              note.textContent = 'Use your Phantom wallet to vote once per week';
            }
          }

          document.querySelectorAll('.utility-rail > .side-widget').forEach((card) => {
            const title = card.querySelector('.widget-title h3')?.textContent?.trim();
            if (title === 'Recently Claimed' || title === 'Recently Added to Swap') {
              card.classList.add('solpitch-obsolete-widget');
            }
          });

          loadTopLeaderboard();

          const directoryHeading = document.querySelector('.feed-toolbar h2');
          if (directoryHeading && directoryHeading.dataset.cleanDirectory !== 'true') {
            directoryHeading.innerHTML = 'Explore New Tokens or <span class="directory-submit-link" role="link" tabindex="0">Submit Your Solana Project</span>';
            directoryHeading.dataset.cleanDirectory = 'true';

            const submitLink = directoryHeading.querySelector('.directory-submit-link');
            submitLink?.addEventListener('click', openSubmissionForm);
            submitLink?.addEventListener('keydown', (event) => {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openSubmissionForm();
              }
            });
          }

          const submissionShell = Array.from(document.querySelectorAll('.workflow-shell')).find((shell) => {
            const title = shell.querySelector('h1');
            return title && (title.textContent === 'Suggest a Solana project' || title.textContent === 'Submit Solana Projects');
          });
          if (submissionShell) {
            const title = submissionShell.querySelector('h1');
            if (title && title.textContent !== 'Submit Solana Projects') {
              title.textContent = 'Submit Solana Projects';
            }

            const intro = submissionShell.querySelector('.workflow-intro');
            if (intro && !submissionShell.querySelector('.submission-claim-note')) {
              const claimNote = document.createElement('p');
              claimNote.className = 'submission-claim-note';
              claimNote.textContent = 'Once approved by admin you can claim it using your Phantom dev wallet if it is yours, or you can invite the owner to claim the listing.';
              intro.before(claimNote);
            }
          }
        };

        const mountFooter = () => {
          updatePublishedCopy();

          const target = document.querySelector('.project-detail, .project-feed');
          if (!target) return;

          let footer = target.querySelector(':scope > .solpitch-site-footer');

          if (!footer) {
            document.querySelectorAll('.solpitch-site-footer').forEach((item) => item.remove());

            const template = document.getElementById('solpitch-footer-template');
            if (!(template instanceof HTMLTemplateElement)) return;

            footer = template.content.firstElementChild.cloneNode(true);
            target.appendChild(footer);
            return;
          }

          if (footer !== target.lastElementChild) {
            target.appendChild(footer);
          }
        };

        const observer = new MutationObserver(mountFooter);
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });

        window.addEventListener('hashchange', () => requestAnimationFrame(mountFooter));
        requestAnimationFrame(mountFooter);
      })();
    </script>
  </body>
</html>
