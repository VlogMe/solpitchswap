name: Remove duplicate submission claim copy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove duplicate runtime claim sentence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = '''            const intro = submissionShell.querySelector('.workflow-intro');
            if (intro && !submissionShell.querySelector('.submission-claim-note')) {
              const claimNote = document.createElement('p');
              claimNote.className = 'submission-claim-note';
              claimNote.textContent = 'Once approved by admin you can claim it using your Phantom dev wallet if it is yours, or you can invite the owner to claim the listing.';
              intro.before(claimNote);
            }
'''
          if old not in text:
              raise SystemExit('Duplicate runtime claim injection not found')
          text = text.replace(old, '', 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove duplicate submission claim copy"
          git push origin gh-pages
