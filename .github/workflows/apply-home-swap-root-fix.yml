name: Apply homepage swap root fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact one-line source fix
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ProductionHome.tsx')
          text = path.read_text()
          old = '? `${SWAP_URL}/widget?outputMint=${encodeURIComponent(selectedSwapProject.contractAddress)}`'
          new = '? `${SWAP_URL}?outputMint=${encodeURIComponent(selectedSwapProject.contractAddress)}`'
          if old not in text:
              raise SystemExit('Expected homepage swap source line not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ProductionHome.tsx
          git commit -m "Use working root swap preload for homepage Buy"
          git push origin main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build corrected main
        working-directory: source
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only new compiled JS and pointer
        run: |
          cp source/dist/assets/index-*.js site/assets/
          NEW_JS=$(basename source/dist/assets/index-*.js)
          export NEW_JS
          python - <<'PY'
          from pathlib import Path
          import os, re
          path = Path('site/index.html')
          text = path.read_text()
          text = re.sub(r'/solpitchswap/assets/index-[^"\']+\.js', f'/solpitchswap/assets/{os.environ["NEW_JS"]}', text, count=1)
          path.write_text(text)
          PY
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          git commit -m "Publish homepage Buy root preload fix"
          git push origin gh-pages
