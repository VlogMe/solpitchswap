name: Deploy Fresh SolPitch Preview

on:
  push:
    branches:
      - agent/fresh-solpitch-listings
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solpitch-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fresh listings branch
        uses: actions/checkout@v4
        with:
          ref: agent/fresh-solpitch-listings

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production preview
        run: npm run build

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
